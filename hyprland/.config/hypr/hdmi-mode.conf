# Use NVIDIA as primary for HDMI output
env = AQ_DRM_DEVICES,/dev/dri/nvidia-dgpu:/dev/dri/amd-igpu

# Keep NVIDIA settings
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1

# Example monitor config (adjust to your needs)
monitor = eDP-1,1920x1080@144,0x0,1.25
monitor = HDMI-A-1,preferred,auto,1  # External monitor
