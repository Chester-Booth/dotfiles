#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 3 # 2
    gaps_out = 0 # 5

    border_size = 0

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    #layout = scrolling
    layout = master
}




# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 0 # 10 
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.8

    shadow {
        #enabled = true
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        #enabled = true
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
     #enabled = yes, please :)
    enabled = no
    # Default animations, see https://wiki.hypr.land/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
 workspace = w[tv1], gapsout:0, gapsin:0
 workspace = f[1], gapsout:0, gapsin:0
 windowrule = border_size 0, rounding 0, match:float 0, match:workspace w[tv1]
 windowrule = border_size 0, rounding 0, match:float 0, match:workspace f[1]
# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = slave
    mfact = 0.70

}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
# 
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
        disable_while_typing = false
        scroll_factor = 0.4
    }
}

# https://wiki.hypr.land/Configuring/Variables/#gestures
gestures {
workspace_swipe_invert = false        #touchpad polarity (flip if right/left reversed)
gesture = 3, horizontal, workspace

#threefingeruptogglespecialmagic
gesture = 3, up, special, magic

#threefingerdownrunswayncclient
gesture = 3, down,dispatcher, exec, swaync-client -t -sw

}



# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################
# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, space, exec, $menu
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, P, pseudo, #w dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, R, exec, ~/Code/scripts/reload-desktop.sh #TODO add to repo

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]


bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10



# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, grave , togglespecialworkspace, magic
bind = $mainMod SHIFT,grave, movetoworkspace, special:magic

## dp-1 workspaces
bind = $mainMod, F1, workspace, monitor_1
bind = $mainMod, F2, workspace, monitor_2
bind = $mainMod, F3, workspace, monitor_3   
bind = $mainMod, F4, workspace, monitor_4
bind = $mainMod, F5, workspace, monitor_5

bind = $mainMod SHIFT, F1, movetoworkspace, monitor_1
bind = $mainMod SHIFT, F2, movetoworkspace, monitor_2
bind = $mainMod SHIFT, F3, movetoworkspace, monitor_3
bind = $mainMod SHIFT, F4, movetoworkspace, monitor_4
bind = $mainMod SHIFT, F5, movetoworkspace, monitor_5

## hdmi-a-1 workspaces

bind = $mainMod, F6, workspace, monitor_6
bind = $mainMod, F7, workspace, monitor_7
bind = $mainMod, F8, workspace, monitor_8
bind = $mainMod, F9, workspace, monitor_9
bind = $mainMod, F10, workspace, monitor_10

bind = $mainMod SHIFT, F6, movetoworkspace, monitor_6
bind = $mainMod SHIFT, F7, movetoworkspace, monitor_7
bind = $mainMod SHIFT, F8, movetoworkspace, monitor_8
bind = $mainMod SHIFT, F9, movetoworkspace, monitor_9
bind = $mainMod SHIFT, F10, movetoworkspace, monitor_10




# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Tab through existing workspaces with mainMod + tab
binde = $mainMod SHIFT, Tab, workspace, m-1
binde = $mainMod, Tab, workspace, m+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume 2
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -2
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness +2
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness -2

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# numpad / key to play/pause music
bindl = , KP_Divide, exec, playerctl play-pause

# numpad + - for ctrl tab
binde = , KP_Subtract, sendshortcut, CONTROL, TAB, 
binde = , KP_Add, sendshortcut, CONTROL SHIFT, TAB, 


# Screenshot region capture
bind = , PRINT, exec, hyprshot -m output
bind = $mainMod SHIFT, S, exec, bash -c 'pgrep -x slurp >/dev/null && pkill -x slurp || hyprshot -m region'
bind = $mainMod ALT, S, exec, bash -c 'pgrep -x slurp >/dev/null && pkill -x slurp || hyprshot -m region --freeze --cursor'



# Colour picker toggle
bind = $mainMod SHIFT, C, exec, bash -c 'pgrep -x hyprpicker >/dev/null && pkill -x hyprpicker || hyprpicker -a &'


# Clipboard manager toggle
bind = $mainMod, V, exec, kitty --class clipse -e 'clipse' 


# toggle bar
bind = $mainMod, backslash, exec, bash -c 'pgrep -x waybar >/dev/null && pkill -x waybar || waybar & ' 

# smile launcher toggle.
bind = $mainMod, period, exec, bash -c 'pgrep -x smile >/dev/null && pkill -x smile || smile & '



##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0


windowrule = float on, size 800 600, match:class ^(thunar)$
windowrule = float on, size 800 600, match:class ^(Thunar)$

# File dialogs float and are centered
windowrule = float on, size 800 600, match:title ^(Open File|Open Files|Save File|Save As|Save Workspace|Select Folder|Open Folder|File Upload)$
windowrule = center on, match:title ^(Open File|Open Files|Save File|Select Folder|Open Folder|File Upload)$
windowrule = float on, center on, match:title ^(File Operation Progress|Copying Files|Moving Files|Deleting Files)$

# Git clone dialog floats and is centered
windowrule = float on, center on, size 800 600, match:title ^Choose a folder to clone .+ into$

# Pulseaudio volume control floats
windowrule = float on, size 600 400, match:class ^(org.pulseaudio.pavucontrol)$

# blueman-manager floats
windowrule = float on, size 800 600, match:class ^(blueman-manager)$

# Zen browser floats for library
windowrule = float on, size 800 600, match:class ^(zen)$, match:title ^(Library)$

# nm-connection-editor floats
windowrule = float on, size 800 600, match:class ^(nm-connection-editor)$

# nmtui floats (from waybar)
windowrule = float on, size 800 600, match:class ^(nmtui)$, match:title ^(nmtui)$

# todo floats (from waybar)
windowrule = float on, size 400 300, pin on, move 1100 520, match:class ^(todo)$, match:title ^(todo)$

# todo floats (from eww)
windowrule = float on, size 350 300, move 50 15, pin on, match:class ^(eww_todo)$, match:title ^(eww_todo)$

# update floats (from waybar)
windowrule = float on, size 860 570, match:class ^(update)$, match:title ^(update)$
# update-list floats (from waybar)
windowrule = float on, size 400 600, match:class ^(update-list)$, match:title ^(update-list)$


# Fingerprint  re-enroll floats
windowrule = float on, size 400 600, match:title ^(Fingerprint Enrollment)$


# Obsidian floats
windowrule = float on, size 800 100, match:title ^(Open folder as vault)$

# Gedit floats 
windowrule = float on, match:class ^(org.gnome.gedit)
windowrule = size 800 600, match:class ^(org.gnome.gedit)$

# Clipse (clipboard manager) floats
windowrule = float on, match:class (clipse) # ensure you have a floating window class set if you want this behavior
windowrule = size 800 652, match:class (clipse) # set the size of the window as necessary

# Nvidia settings floats
windowrule = float on, match:class ^(nvidia-settings)$
windowrule = size 800 600, match:class ^(nvidia-settings)$

# PIP floats and is pinned across workspaces
windowrule = float on, pin on, move ((monitor_w*0.69)) ((monitor_h*0.06)), match:title ^(Picture-in-Picture)$


# Magic workspace windows float
windowrule = size 600 500, float on, move ((monitor_w*0.05)) ((monitor_h*0.07)), match:workspace name:special:magic

# Smile Emoji selector floats
windowrule = float on, size 400 300, pin on, match:class ^(it.mijorus.smile)$


# Apps launch in correct locations

# IntelliJ Community
windowrule = workspace 2 silent, match:class ^(jetbrains-idea-ce)$

# IntelliJ Ultimate
windowrule = workspace 2 silent, match:class ^(jetbrains-idea)$

# VSCode
## Set to 2 but if intellij is open then it goes to 4
windowrule = workspace 2 silent, match:class ^(code)$

# Discord
windowrule = workspace 5 silent, match:class ^(discord)$



#fix blurry low res apps
xwayland{ 
    force_zero_scaling = true
}


# blur for wofi via https://github.com/elifouts/Dotfiles?tab=readme-ov-file
layerrule = blur on, ignore_alpha 0.5, match:namespace wofi
#now blur for swaync
layerrule = blur on, ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = blur on, ignore_alpha 0.5, match:namespace swaync-notification-window
