##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland.
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Keep external-monitor workspaces fully opaque, even when inactive.
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:workspace 11
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:workspace 12
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:workspace 13
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:workspace 14
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:workspace 15
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:workspace 16
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:workspace 17
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:workspace 18
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:workspace 19
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:workspace 20
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:workspace 21
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:workspace 22

windowrule = float on, size 800 600, match:class ^(thunar)$
windowrule = float on, size 800 600, match:class ^(Thunar)$

# File dialogs float and are centered.
windowrule = float on, size 800 600, match:title ^(Open File|Open Files|Save File|Save As|Save Workspace|Select Folder|Open Folder|File Upload)$
windowrule = center on, match:title ^(Open File|Open Files|Save File|Save As|Select Folder|Open Folder|File Upload)$
windowrule = float on, center on, size 800 600, match:class ^(xdg-desktop-portal-gtk)$, match:title ^(Open File|Open Files|Save File|Save As|Select Folder|Open Folder|File Upload).*Zen Browser$
windowrule = float on, center on, match:title ^(File Operation Progress|Copying Files|Moving Files|Deleting Files)$

# Git clone dialog floats and is centered.
windowrule = float on, center on, size 800 600, match:title ^Choose a folder to clone .+ into$

windowrule = float on, size 600 400, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, size 800 600, match:class ^(blueman-manager)$
windowrule = float on, size 800 600, match:class ^(zen)$, match:title ^(Library)$
windowrule = float on, size 800 600, match:class ^(nm-connection-editor)$
windowrule = float on, size 800 600, match:class ^(nmtui)$, match:title ^(nmtui)$
windowrule = float on, size 400 300, pin on, move 1100 520, match:class ^(todo)$, match:title ^(todo)$
windowrule = float on, pin on, match:class ^(eww_todo)$, match:title ^(eww_todo)$
windowrule = float on, size 860 570, match:class ^(update)$, match:title ^(update)$
windowrule = float on, size 400 600, match:class ^(update-list)$, match:title ^(update-list)$

windowrule = float on, size 400 600, match:title ^(Fingerprint Enrollment)$
windowrule = float on, size 800 100, match:title ^(Open folder as vault)$

windowrule = float on, match:class ^(org.gnome.gedit)
windowrule = size 800 600, match:class ^(org.gnome.gedit)$

windowrule = float on, size 480 480, move ((monitor_w*0.74)) ((monitor_h*0.06)), match:class ^(micro-active)$

windowrule = float on, match:class ^(nvidia-settings)$
windowrule = size 800 600, match:class ^(nvidia-settings)$

windowrule = float on, pin on, move ((monitor_w*0.69)) ((monitor_h*0.06)), match:title ^(Picture-in-Picture)$

windowrule = size 600 500, float on, move ((monitor_w*0.05)) ((monitor_h*0.07)), match:workspace name:special:magic
# Apps launch in correct locations.
windowrule = match:class ^(jetbrains-idea-ce)$, match:float 0, workspace 2 silent
windowrule = match:class ^(jetbrains-idea)$, match:float 0, workspace 2 silent
windowrule = workspace 5 silent, match:class ^(discord)$

xwayland {
    force_zero_scaling = true
}

layerrule = blur on, ignore_alpha 0.5, match:namespace wofi
layerrule = blur on, ignore_alpha 0.2, match:namespace swaync-control-center
layerrule = blur on, ignore_alpha 0.2, match:namespace swaync-notification-window
