#monitor=eDP-1,1920x1080@60,auto,1.25
monitor=DP-1,preferred,auto,1.5
monitor=HDMI-A-1,preferred,auto,2

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
#$menu = vicinae toggle
$menu = pgrep -x wofi >/dev/null 2>&1 && killall wofi || wofi --show drun --location top -y 200
$editor = micro
$visual = micro

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# 1. Update systemd environment variables FIRST
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# 2. THEN start the authentication agent
exec-once = bash -c "sleep 1 && systemctl --user restart hyprpolkitagent"

# 3. Your other apps (Split them up for better stability)
exec-once = waybar
exec-once = hyprpaper
exec-once = swaync
exec-once = blueman-applet
exec-once = hypridle
exec-once = swayosd-server
exec-once = hyprsunset
exec-once = clipse -listen
#exec-once = vicinae server
exec-once = zen-browser

exec-once = ~/.config/waybar/scripts/todo/update_gcal_md.sh
exec-once = eww daemon
exec-once = ~/.config/eww/scripts/workspace_monitor.sh

exec-once = ~/.config/hypr/scripts/code-workspace-router.sh

# Auto-mounts
exec-once = bash -c "rclone mount gdrive: ~/Cloud/GoogleDrive --vfs-cache-mode full --daemon"
exec-once = bash -c "rclone mount icloud: ~/Cloud/iCloudDrive --vfs-cache-mode full --daemon"

