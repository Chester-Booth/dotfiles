# style name or JSON path (default "auto")
# Glow 2.1.2 passes custom paths to Glamour without expanding them.
style: "/home/blox/.config/glow/blox-theme.json"
# mouse wheel support (TUI-mode only)
mouse: true
# use pager to display markdown
pager: false
# word-wrap at width
width: 80
# show all files, including hidden and ignored.
all: false
