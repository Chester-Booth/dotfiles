###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, M, exec, kitty --class micro-active -e micro
bind = $mainMod, space, exec, $menu
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, O, exec, ~/.config/hypr/scripts/toggle-orca.sh
bind = $mainMod, P, pseudo, #w dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + arrow keys.
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9].
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9].
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace.
bind = $mainMod, grave , togglespecialworkspace, magic
bind = $mainMod SHIFT,grave, movetoworkspace, special:magic

# DP-1 workspaces.
bind = $mainMod, F1, workspace, 11
bind = $mainMod, F2, workspace, 12
bind = $mainMod, F3, workspace, 13
bind = $mainMod, F4, workspace, 14
bind = $mainMod, F5, workspace, 15
bind = $mainMod, F6, workspace, 16
bind = $mainMod, F7, workspace, 17
bind = $mainMod, F8, workspace, 18
bind = $mainMod, F9, workspace, 19
bind = $mainMod, F10, workspace, 20

bind = $mainMod SHIFT, F1, movetoworkspace, 11
bind = $mainMod SHIFT, F2, movetoworkspace, 12
bind = $mainMod SHIFT, F3, movetoworkspace, 13
bind = $mainMod SHIFT, F4, movetoworkspace, 14
bind = $mainMod SHIFT, F5, movetoworkspace, 15
bind = $mainMod SHIFT, F6, movetoworkspace, 16
bind = $mainMod SHIFT, F7, movetoworkspace, 17
bind = $mainMod SHIFT, F8, movetoworkspace, 18
bind = $mainMod SHIFT, F9, movetoworkspace, 19
bind = $mainMod SHIFT, F10, movetoworkspace, 20

# HDMI-A-1 workspaces.
bind = $mainMod, F11, workspace, 21
bind = $mainMod, F12, workspace, 22

bind = $mainMod SHIFT, F11, movetoworkspace, 21
bind = $mainMod SHIFT, F12, movetoworkspace, 22

# Scroll through existing workspaces with mainMod + scroll.
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Tab through existing workspaces with mainMod + tab.
binde = $mainMod SHIFT, Tab, workspace, m-1
binde = $mainMod, Tab, workspace, m+1

# Move/resize windows with mainMod + LMB/RMB and dragging.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness.
bindel = ,XF86AudioRaiseVolume, exec, ~/.config/quickshell/blox/scripts/osd/control.sh volume-up 2
bindel = ,XF86AudioLowerVolume, exec, ~/.config/quickshell/blox/scripts/osd/control.sh volume-down 2
bindel = ,XF86AudioMute, exec, ~/.config/quickshell/blox/scripts/osd/control.sh volume-mute
bindel = ,XF86AudioMicMute, exec, ~/.config/quickshell/blox/scripts/osd/control.sh mic-mute
bindel = ,XF86MonBrightnessUp, exec, ~/.config/quickshell/blox/scripts/osd/control.sh brightness-up 2
bindel = ,XF86MonBrightnessDown, exec, ~/.config/quickshell/blox/scripts/osd/control.sh brightness-down 2
bindel = ,XF86KbdBrightnessUp, exec, ~/.config/quickshell/blox/scripts/osd/control.sh keyboard-up 1
bindel = ,XF86KbdBrightnessDown, exec, ~/.config/quickshell/blox/scripts/osd/control.sh keyboard-down 1
bindel = ,XF86KbdLightOnOff, exec, ~/.config/quickshell/blox/scripts/osd/control.sh keyboard-toggle
bindl = ,Caps_Lock, exec, ~/.config/quickshell/blox/scripts/osd/control.sh caps
bindl = ,XF86WebCam, exec, ~/.config/quickshell/blox/scripts/osd/control.sh camera-toggle
bindl = ,XF86TouchpadToggle, exec, ~/.config/quickshell/blox/scripts/osd/control.sh touchpad-toggle
bindl = ,XF86PowerOff, exec, quickshell ipc -c blox call power toggle

# Requires playerctl.
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86Launch1, exec, bash -c 'pgrep -x slurp >/dev/null && pkill -x slurp || ~/.config/hypr/scripts/ocr-region-to-clipboard.sh'

# Numpad / key to play/pause music.
bindl = , KP_Divide, exec, playerctl play-pause

# Numpad + - for ctrl tab.
binde = , KP_Subtract, sendshortcut, CONTROL, TAB, activewindow
binde = , KP_Add, sendshortcut, CONTROL SHIFT, TAB, activewindow

# Screenshot region capture.
bind = , PRINT, exec, hyprshot -m output
bind = $mainMod SHIFT, S, exec, bash -c 'pgrep -x slurp >/dev/null && pkill -x slurp || hyprshot -m region'
bind = $mainMod ALT, S, exec, bash -c 'pgrep -x slurp >/dev/null && pkill -x slurp || hyprshot -m region --freeze --cursor'
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/ocr-region-to-clipboard.sh

# Colour picker toggle.
bind = $mainMod SHIFT, C, exec, bash -c 'pgrep -x hyprpicker >/dev/null && pkill -x hyprpicker || hyprpicker -a &'

# Clipboard manager toggle.
bind = $mainMod, V, exec, vicinae deeplink 'vicinae://launch/clipboard/history'

# Toggle bar.
bind = $mainMod, backslash, exec, quickshell ipc -c blox call bar toggle

# Emoji picker.
bind = $mainMod, period, exec, vicinae deeplink 'vicinae://launch/core/search-emojis'
