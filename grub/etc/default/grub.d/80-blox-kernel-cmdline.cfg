# Managed by dotfiles.
# Keep the normal Arch boot quiet while preserving hibernate resume support.
# The dotfiles-managed mkinitcpio blox-resume hook suppresses harmless cold-boot
# resume probe warnings.
# The N156HMA-GA1 panel's custom AMD curve maps its top two steps to zero.
GRUB_CMDLINE_LINUX_DEFAULT="quiet nvidia-drm.modeset=0 amdgpu.dcdebugmask=0x40000 resume=UUID=d22117c8-6b07-420e-848a-ceba26ea2ecd resume_offset=85856907"
