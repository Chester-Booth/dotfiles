#############
### INPUT ###
#############

input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
        disable_while_typing = false
        scroll_factor = 0.4
    }
}

gestures {
    workspace_swipe_invert = false
    gesture = 3, horizontal, workspace
    gesture = 3, up, special, magic
    gesture = 3, down,dispatcher, exec, swaync-client -t -sw
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
