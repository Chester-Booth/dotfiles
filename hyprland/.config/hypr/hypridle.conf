general {
    lock_cmd = ~/.config/quickshell/blox/scripts/power/safe.sh lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = bash -lc 'hyprctl dispatch dpms on; ~/.config/quickshell/blox/scripts/gpu/resume-reconcile.sh >/dev/null 2>&1 &'
    inhibit_sleep = 2
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
